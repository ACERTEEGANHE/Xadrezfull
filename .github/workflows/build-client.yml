
name: Build WorldXadrez Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        working-directory: client
        run: npm install

      - name: Compilar aplicativo web
        working-directory: client
        env:
          VITE_GAME_SERVER_URL: ${{ vars.VITE_GAME_SERVER_URL }}
        run: npm run build

      - name: Guardar arquivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: worldxadrez-client
          path: client/dist/
